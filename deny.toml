# cargo-deny supply-chain gate. Run with `cargo deny check`.
# Advisories ignores mirror `.cargo/audit.toml` (same two transitive
# quick-xml findings); see that file for the full justification.

[advisories]
ignore = [
    # Transitive quick-xml 0.39.4 via polars-error -> object_store 0.13.2
    # (cloud-protocol XML only; our parsing uses direct quick-xml 0.42).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # chrono ecosystem maintenance has ended; 0.4.45 is final and stable
    # with no vulnerabilities. chrono is load-bearing (18 files: models,
    # parsers, network timestamps). Migration to `time`/`jiff` is deferred
    # deliberately: large blast radius for zero functional gain. Revisit
    # only if a real vulnerability lands.
    "RUSTSEC-2026-0543", # chrono
    "RUSTSEC-2026-0555", # chrono-tz
    "RUSTSEC-2026-0542", # humantime
    # bincode: transitive, serialization format stable, no vulnerabilities.
    "RUSTSEC-2025-0141",
    # proc-macro-error2: build-time only (via merge_derive), not shipped.
    "RUSTSEC-2026-0173",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# transitive duplicates we cannot resolve from our side (pinned upstream)
skip = [
    # polars-error -> object_store pins quick-xml ^0.39; our direct dep is 0.42
    { name = "quick-xml", version = "0.39.4" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "BSL-1.0",
    # our own license
    "PolyForm-Noncommercial-1.0.0",
]
confidence-threshold = 0.8
exceptions = []
